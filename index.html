<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BidHub - leilões ao vivo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="top-bar">
    <div class="brand">Bid<span>Hub</span></div>
    <nav class="tabs">
      <button id="tab-catalogo" class="active">Catálogo de leilões</button>
      <button id="tab-live">Leilão ao vivo</button>
    </nav>
  </div>

  <main>
    <section id="view-catalogo" class="view active">
      <div class="page-header">
        <h1>Leilões</h1>
        <p>Itens verificados, em transmissão ao vivo ou agendados.</p>
      </div>
      <div class="catalogo-list" id="catalogo-list">
        <p class="loading">Carregando leilões...</p>
      </div>
      <p class="source-note">Dados obtidos via GET no endpoint da Azure Function (ver <code>js/app.js</code>).</p>
    </section>

    <section id="view-live" class="view">
      <div id="live-view"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
